<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b0f">
<link rel="icon" type="image/png" href="assets/case17-icon.png">
<link rel="apple-touch-icon" href="assets/case17-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>CASE 17 — ملفات التحقيق</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
<header class="brand">
  <div class="logo"><img src="assets/case17-icon.png" alt="CASE 17"></div>
  <div><strong>CASE 17</strong><small>ملفات تحقيق متسلسلة</small></div>
</header>

<main id="homeView">
<section class="hero panel">
  <span class="eyebrow">وحدة القضايا الخاصة</span>
  <h1>كل شخص يخفي شيئًا. ليس كل سر جريمة.</h1>
  <p>20 قضية مقتبسة ومُعاد صياغتها من ألغاز تحقيق كلاسيكية منشورة. ابدأ من القضية الأولى؛ حل كل ملف يفتح الملف التالي، من السهل إلى المتوسط ثم الصعب والخبير.</p>
  <div class="progress-card">
    <div class="progress-head"><span>التقدم العام</span><strong id="progressText">0 من 20</strong></div>
    <div class="progress-track"><span id="progressBar"></span></div>
  </div>
  <div class="filters">
    <button class="filter active" data-filter="الكل">الكل</button>
    <button class="filter easy" data-filter="سهل">سهل</button>
    <button class="filter medium" data-filter="متوسط">🔒 متوسط</button>
    <button class="filter hard" data-filter="صعب">🔒 صعب</button>
    <button class="filter expert" data-filter="خبير">🔒 خبير</button>
  </div>
</section>
<section class="case-grid" id="caseGrid"></section>
</main>

<main id="caseView" class="hidden">
  <button class="back" id="backBtn">← رجوع لملفات القضايا</button>
  <section id="caseContent"></section>
</main>
</div>

<script src="data/cases-01.js"></script>
<script src="data/cases-02.js"></script>
<script src="data/cases-03.js"></script>
<script src="data/cases-04a.js"></script>
<script src="data/cases-04b.js"></script>
<script src="app.js"></script>
</body>
</html>
