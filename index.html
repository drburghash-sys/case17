<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<link rel="icon" type="image/png" sizes="96x96" href="assets/case17-icon.png">
<link rel="apple-touch-icon" href="assets/case17-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>CASE 17</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
<header class="brand"><div class="logo">17</div><div><strong>CASE 17</strong><small>50 قضية تحقيق مستقلة</small></div></header>
<main id="homeView">
<section class="hero panel">
<span class="eyebrow">ملفات التحقيق</span>
<h1>لا تثق بأول تفسير.</h1>
<p>كل قضية لها أسرارها وطريقة تنفيذها ومسار استنتاج مختلف. بعض الأدلة صحيحة لكنها مضللة إذا قرأتها وحدها.</p>
<div class="progress-card"><div class="progress-head"><span>التقدم العام</span><strong id="progressText">0 من 50</strong></div><div class="progress-track"><span id="progressBar"></span></div></div>
<div class="filters">
<button class="filter active" data-filter="الكل">الكل</button>
<button class="filter easy" data-filter="سهل">سهل</button>
<button class="filter medium" data-filter="متوسط">متوسط</button>
<button class="filter hard" data-filter="صعب">صعب</button>
<button class="filter expert" data-filter="خبير">خبير</button>
</div>
</section>
<section class="case-grid" id="caseGrid"></section>
</main>
<main id="caseView" class="hidden">
<button class="back" id="backBtn">← رجوع للقضايا</button>
<section id="caseContent"></section>
</main>
</div>
<script src="cases.js"></script>
<script src="app.js"></script>
</body></html>
